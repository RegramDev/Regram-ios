name: Publish confirmed IPA

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build Regram run ID
        required: true
        type: string
      ipa_filename:
        description: Exact approved filename (Regram-13.0-b40001.ipa)
        required: true
        type: string
      confirm_publish:
        description: I confirm publishing this IPA filename and build to Releases
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: regram-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ inputs.confirm_publish && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the approved build and filename
        id: selection
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          IPA_FILENAME: ${{ inputs.ipa_filename }}
        run: |
          python3 build-system/ci/release.py prepare \
            --run-id "$BUILD_RUN_ID" --filename "$IPA_FILENAME" \
            --request build-input/release/request.json

      - name: Download only the approved IPA
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.selection.outputs.artifact_id }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: build-input/release/ipa
          skip-decompress: true
          digest-mismatch: error

      - name: Publish the confirmed IPA to Releases
        run: |
          python3 build-system/ci/release.py publish --confirmed \
            --request build-input/release/request.json --directory build-input/release/ipa
