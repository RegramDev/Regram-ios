name: TestFlight

on:
  workflow_dispatch:
    inputs:
      mode:
        description: TestFlight mode (select the regram-beta branch)
        type: choice
        options: [build, publish, distribute]
        default: publish
        required: true
      build_number:
        description: Existing build number (required for distribute mode)
        type: string

permissions:
  contents: read

# GitHub requires this manual entry point on the default branch. The full
# workflow and all private signing/upload code live on regram-beta.
jobs:
  select-beta:
    name: Select regram-beta to run TestFlight
    runs-on: ubuntu-latest
    steps:
      - name: Explain the distribution branch
        run: |
          echo "::error::TestFlight runs only on regram-beta. Select regram-beta in Run workflow. master builds sideload reference IPAs."
          exit 1
