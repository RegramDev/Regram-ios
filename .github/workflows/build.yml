name: Build Regram

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regram-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Select repository build number
        run: python3 build-system/ci/versioning.py --github-env "$GITHUB_ENV"

      - name: Prepare encrypted configuration
        env:
          REGRAM_BUILD_CONFIGURATION: ${{ secrets.REGRAM_BUILD_CONFIGURATION }}
        run: |
          set -euo pipefail
          mkdir -p build-input/ci
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          value = os.environ.get('REGRAM_BUILD_CONFIGURATION', '')
          if not value:
              raise SystemExit('Configure the REGRAM_BUILD_CONFIGURATION repository Secret before building')
          try:
              json.loads(value)
          except ValueError:
              raise SystemExit('The CI build configuration Secret is not valid JSON') from None
          path = Path('build-input/ci/configuration.json')
          path.write_text(value)
          path.chmod(0o600)
          PY

      - name: Reclaim simulator disk space
        run: |
          set -euo pipefail
          xcrun simctl delete all || true
          xcrun simctl runtime delete all || true
          sudo rm -rf /Library/Developer/CoreSimulator/Caches || true
          df -h .

      - name: Install the Xcode Metal toolchain
        run: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain
          xcrun --find metal

      - name: Restore Bazel output cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-input/ci-cache
          key: regram-xcode27-arm64-${{ hashFiles('versions.json', 'MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', 'build-system/patches/*.patch') }}-${{ github.sha }}
          restore-keys: |
            regram-xcode27-arm64-${{ hashFiles('versions.json', 'MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', 'build-system/patches/*.patch') }}-

      - name: Build and package Regram arm64 reference IPA
        run: bash build-system/ci/build.sh

      - name: Upload the IPA file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/artifacts/*.ipa
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Remove plaintext build inputs
        if: always()
        run: rm -rf build-input/ci/configuration.json build-input/configuration-repository
