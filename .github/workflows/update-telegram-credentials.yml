name: Update Telegram credentials privately
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [prepare, verify]
        required: true
        default: verify
      encryption_key:
        type: string
        required: false
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UPDATE_MODE: ${{ inputs.mode }}
      ENCRYPTION_KEY: ${{ inputs.encryption_key }}
      NEW_API_ID: ${{ secrets.TELEGRAM_CREDENTIAL_UPDATE_ID }}
      NEW_API_HASH: ${{ secrets.TELEGRAM_CREDENTIAL_UPDATE_HASH }}
      REGRAM_BUILD_CONFIGURATION: ${{ secrets.REGRAM_BUILD_CONFIGURATION }}
      REGRAM_BETA_BUILD_CONFIGURATION: ${{ secrets.REGRAM_BETA_BUILD_CONFIGURATION }}
    steps:
      - name: Install encryption library on hosted runner
        if: inputs.mode == 'prepare'
        run: python3 -m pip install --disable-pip-version-check PyNaCl==1.6.0
      - name: Validate and encrypt credentials without logging plaintext
        run: |
          python3 - <<'PYCODE'
          import base64, json, os, re
          api_id, api_hash = os.environ['NEW_API_ID'], os.environ['NEW_API_HASH']
          if not api_id.isdigit() or int(api_id) <= 0 or not re.fullmatch('[a-fA-F0-9]{32}', api_hash):
              raise SystemExit('Replacement Telegram credentials are missing or invalid')
          mode = os.environ['UPDATE_MODE']
          if mode == 'prepare':
              from nacl.public import PublicKey, SealedBox
              box = SealedBox(PublicKey(base64.b64decode(os.environ['ENCRYPTION_KEY'], validate=True)))
          for name in ('REGRAM_BUILD_CONFIGURATION', 'REGRAM_BETA_BUILD_CONFIGURATION'):
              try:
                  original = json.loads(os.environ[name])
              except Exception:
                  raise SystemExit('Stored build configuration is invalid') from None
              if not isinstance(original, dict) or not {'telegram_api_id', 'telegram_api_hash'} <= original.keys():
                  raise SystemExit('Stored build configuration has an unexpected schema')
              updated = dict(original, telegram_api_id=api_id, telegram_api_hash=api_hash)
              if mode == 'prepare':
                  assert original.keys() == updated.keys()
                  assert all(original[k] == updated[k] for k in original if k not in ('telegram_api_id', 'telegram_api_hash'))
                  payload = json.dumps(updated, separators=(',', ':')).encode()
                  print('ENCRYPTED_' + name + '=' + base64.b64encode(box.encrypt(payload)).decode())
              elif mode == 'verify':
                  if original != updated:
                      raise SystemExit(name + ': stored credentials do not match the replacement')
                  print(name + ': replacement Telegram credentials verified')
              else:
                  raise SystemExit('Unknown operation')
          PYCODE
